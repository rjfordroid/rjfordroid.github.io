  <link rel="stylesheet" href="css/style.css">
  <style>
  
    /* Carte principale – design épuré, ombre douce, coins arrondis */
    .profile-card {
      max-width: 1040px;
      width: 100%;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15), 0 4px 18px 0 rgba(0,0,0,0.05);
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.5);
      transition: all 0.3s ease;
    }

    /* mise en page flexible */
    .profile-grid {
      display: grid;
      align-items: start;
    }

    /* ===== COLONNE DE GAUCHE ===== */
    .profile-left {
      background: white;
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.02), 0 8px 20px -8px rgba(0,35,65,0.1);
      border: 1px solid rgba(255,255,255,0.7);
      text-align: center;
    }

    .avatar-frame {
      width: 140px;
      height: 140px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b5876, #1e3a5f);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 25px -8px rgba(20, 60, 100, 0.25);
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #fafcff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23344e6c" width="80px" height="80px"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>') no-repeat center/60%;
      background-color: #eef3f9;
      border: 3px solid white;
    }

    .name {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      color: #0b1e2c;
    }

    .badge {
      display: inline-block;
      background: #e1eaf1;
      color: #1e3a5f;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      margin: 0.5rem 0 1rem;
      backdrop-filter: blur(4px);
    }

    .title {
      font-size: 1rem;
      font-weight: 400;
      color: #4a627a;
      margin-bottom: 1.6rem;
      border-bottom: 1px dashed #cbd6e4;
      padding-bottom: 1.2rem;
    }

    .info-list {
      list-style: none;
      text-align: left;
      margin-top: 0.5rem;
    }

    .info-list li {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.95rem;
      padding: 0.6rem 0;
      color: #2d4054;
      border-bottom: 1px solid #e8ecf2;
    }

    .info-list li:last-child {
      border-bottom: none;
    }

    .info-list i {
      width: 24px;
      color: #1f4973;
      font-size: 1.1rem;
      text-align: center;
    }

    /* ===== COLONNE DE DROITE ===== */
    .profile-right {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* cartes de contenu */
    .card {
      background: white;
      border-radius: 1.8rem;
      padding: 1.6rem 2rem;
      box-shadow: 0 6px 18px -6px rgba(0,32,64,0.08);
      border: 1px solid rgba(255,255,255,0.8);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.2rem;
    }

    .card-header i {
      font-size: 1.5rem;
      color: #1f4973;
      background: #e9f0f9;
      padding: 8px;
      border-radius: 14px;
    }

    .card-header h2 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #152f44;
    }

    /* about text */
    .about-text {
      color: #2d4054;
      line-height: 1.6;
      font-size: 0.98rem;
      margin-bottom: 1.4rem;
    }

    /* compétences : tags modernes */
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 1rem 0 0.2rem;
    }

    .skill-tag {
      background: #edf3fa;
      color: #1c3f5c;
      padding: 0.45rem 1.1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: 1px solid #d5e2ef;
      transition: all 0.1s ease;
    }

    .skill-tag:hover {
      background: #dde9f5;
      border-color: #a0bbd4;
    }

    /* timeline expérience */
    .exp-item {
      display: flex;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .exp-icon {
      background: #e9f0f9;
      border-radius: 16px;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e3f60;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .exp-content h3 {
      font-weight: 650;
      font-size: 1.06rem;
      margin-bottom: 0.15rem;
      color: #122b3c;
    }

    .exp-meta {
      font-size: 0.85rem;
      color: #54718c;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .exp-meta i {
      font-size: 0.7rem;
      margin-right: 3px;
    }

    .exp-content p {
      font-size: 0.92rem;
      color: #314d65;
      line-height: 1.5;
    }

    /* Réseaux sociaux */
    .social-links {
      display: flex;
      gap: 0.9rem;
      margin-top: 0.5rem;
    }

    .social-link {
      background: white;
      border: 1px solid #dbe3ed;
      color: #1e3a5f;
      width: 44px;
      height: 44px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      text-decoration: none;
    }

    .social-link:hover {
      background: #1e3a5f;
      color: white;
      border-color: #1e3a5f;
      transform: translateY(-3px);
    }

    /* petits ajustements responsives */
    @media (max-width: 780px) {
      .profile-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .profile-left {
        max-width: 400px;
        margin: 0 auto;
      }
      .profile-card {
        padding: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 1.2rem;
      }
      .exp-item {
        flex-direction: column;
        gap: 0.5rem;
      }
    }

    /* petit détail + pro: indicateur de disponibilité */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e3f1ed;
      color: #1c6f5c;
      border-radius: 40px;
      padding: 0.2rem 1rem 0.2rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 500;
      margin: 1rem 0 0.2rem;
    }
    .status .dot {
      width: 10px;
      height: 10px;
      background: #0f9d7a;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } }

    /* bouton contact */
    .contact-btn {
      background: #1e3a5f;
      color: white;
      border: none;
      width: 100%;
      padding: 0.9rem;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 50px;
      margin-top: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: default;
      transition: background 0.2s;
      border: 1px solid #24496e;
    }
    .contact-btn i { font-size: 1rem; }
    .contact-btn:hover {
      background: #244f78;
    }
    
    .mini-course {
  background: #f6f9fc;
  border: 1px solid #e3ecf5;
  padding: 1rem;
  border-radius: 16px;
  margin-bottom: 1rem;
  transition: 0.2s;
}

.mini-course:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 18px -8px rgba(0,0,0,0.15);
}

.mini-course h4 {
  font-size: 1rem;
  margin-bottom: 0.4rem;
  color: #13293d;
}

.progress-bar {
  height: 6px;
  background: #dce6f1;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg,#1e3a5f,#3b6fa1);
}

.course-btn {
  margin-top: 10px;
  background: #1e3a5f;
  color: white;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 30px;
  font-size: 0.85rem;
  cursor: pointer;
}
  </style>
</head>
<body>
      <!--config-->
<span>  
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/userSidebar.js"></script>
  <script src="js/layout.js"></script>
    
  <header class="app-header" id="header"></header>
  <div class="sidebar" id="sidebar"></div>
  <div class="overlay" id="overlay"></div>
  <footer class="app-footer" id="footer">
  </footer>
</span>
  <!-- CONTENU PRINCIPAL-->
  <main class="main-content">
  <div class="profile-card">
    <div class="profile-grid">
      <!-- COLONNE GAUCHE : PHOTO + INFOS PERSO + CONTACT -->
      <div class="profile-left">
        <div class="avatar-frame">
          <div class="avatar" aria-label="avatar professionnel"></div>
        </div>
        <h1 class="name" id="name"></h1>
  <div id="sidebarUser">
        <span id="username"></span>
        <span id="CreditUser"></span>
        <span id="emailUser"></span>
      </div>
        <!-- petite statut dispo -->
        <div class="status">
          <span class="dot"></span> Ouverte à de nouvelles missions
        </div>

<!-- COLONNE DROITE -->
<div class="profile-right">

  <!-- MES COURS -->
  <div class="card">
    <div class="card-header">
      <i class="fas fa-book-open"></i>
      <h2>Mes cours inscrits</h2>
    </div>

    <div id="mesCoursContainer"></div>
  </div>

</div>

        <!-- bouton contact (inactif mais visuel) -->
        <div class="contact-btn">
          <i class="fas fa-paper-plane"></i> Contacter
        </div>
      </div>

         </div>
  </div>
</main>

<script>
async function chargerMesCours() {
  const uid = localStorage.getItem("connectedUID");
  if (!uid) return;

  const userSnap = await firebase.database()
    .ref("RJFORDROID/USERS/" + uid)
    .once("value");

  const user = userSnap.val();
  if (!user?.mes_cours) {
    document.getElementById("mesCoursContainer").innerHTML =
      "<p>Aucun cours inscrit pour le moment.</p>";
    return;
  }

  const coursSnap = await firebase.database()
    .ref("RJFORDROID/COURE")
    .once("value");

  const allCourses = coursSnap.val() || {};
  const container = document.getElementById("mesCoursContainer");
  container.innerHTML = "";

  Object.keys(user.mes_cours).forEach(courseId => {
    const course = allCourses[courseId];
    if (!course) return;

    const totalLessons = Object.keys(course.lessons || {}).length;
    const doneLessons = Object.keys(
      user.mes_cours[courseId].lessons || {}
    ).length;

    const progression = totalLessons
      ? Math.round((doneLessons / totalLessons) * 100)
      : 0;

    const div = document.createElement("div");
    div.className = "mini-course";

    div.innerHTML = `
      <h4>${course.NomCours}</h4>
      <small>${progression}% complété</small>

      <div class="progress-bar">
        <div class="progress-fill" style="width:${progression}%"></div>
      </div>

      <button class="course-btn"
        onclick="window.location.href='lecon.html?id=${courseId}'">
        Continuer
      </button>
    `;

    container.appendChild(div);
  });
}

window.addEventListener("load", chargerMesCours);
</script>
</body>
