  <title>RJ4DROID · app mobile</title>
  <!-- Font Awesome Icons (v6) + Google Font Inter -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  
<style>
.container{
  border: 1px solid lime;
  max-width:1100px;
  margin:auto;
  padding:2px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
}
.card{
  background:white;
  border-radius:8px;
  box-shadow:0 4px 10px rgba(0,0,0,0.05);
  overflow:hidden;
  transition:0.3s;
  padding: 0;
}
.card:hover{
  transform:translateY(-5px);
}
.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  margin: 0;
}
.card-content{
  padding:15px;
}
.card h2{
  font-size:20px;
  margin:0 0 10px;
}
.card p{
  font-size:14px;
  color:#555;
}
.read-btn{
  display:inline-block;
  margin-top:10px;
  padding:8px 12px;
  background:#111;
  color:white;
  text-decoration:none;
  border-radius:4px;
  font-size:14px;
}
</style>
</head>
<body>
      <!--config-->
<span>  
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/userSidebar.js"></script>
  <script src="js/layout.js"></script>
    
  <header class="app-header" id="header"></header>
  <div class="sidebar" id="sidebar"></div>
  <div class="overlay" id="overlay"></div>
  <footer class="app-footer" id="footer">
  </footer>
</span>
  <!-- CONTENU PRINCIPAL-->
  <main class="main-content">
    <div class="container" id="blogContainer">
      <article class="card">
          <img loading="lazy" src="image/image.png" alt="${data.title}">
          <div class="card-content">
            <h2>Mon premier aryicle data</h2>
            <p>Dans cet article ,vous allez apprendre a securiser votre android et naviguer plus fluide les connection wifi</p>
            <a class="read-btn" href="article.html?id=${child.key}">Lire l'article</a>
          </div>
        </article>
    </div>
    <div class="ad-space">
<!-- Bloc AdSense 2 -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4800728968697075"
     crossorigin="anonymous"></script>
<ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="ca-pub-4800728968697075"
     data-ad-slot="7551320679"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</div>
  </main>
  <script>
var blogContainer = document.getElementById("blogContainer");

db.ref("RJFORDROID/ARTICLES").on("value", function(snapshot){

  blogContainer.innerHTML = "";

  if(!snapshot.exists()){
    blogContainer.innerHTML = "<p>Aucun article disponible.</p>";
    return;
  }

  snapshot.forEach(function(child){

    var data = child.val();

    if(data && data.online === true){

      blogContainer.innerHTML += `
        <article class="card">
          <img loading="lazy" src="${data.image}" alt="${data.title}">
          <div class="card-content">
            <h2>${data.title}</h2>
            <p>${data.summary}</p>
            <a class="read-btn" href="article.html?id=${child.key}">Lire l'article</a>
          </div>
        </article>
      `;

    }

  });

});
</script>
</body>
</html>
