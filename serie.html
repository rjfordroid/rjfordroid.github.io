<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>RJFORDROID SERIES - Dashboard Aktivite</title>
    <link rel="icon" type="image/png" href="image/logo1.png">
    <meta name="theme-color" content="#fe2c55"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        :root {
            --primary-color: #fe2c55;
            --success-color: #25d366;
            --bg-dark: #010101;
        }

        /* DASHBOARD GLOBAL */
        .global-stats-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .stat-card-global {
            background: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            flex: 1;
            max-width: 150px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid #eee;
        }

        .stat-card-global i {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .stat-card-global span {
            display: block;
            font-weight: 800;
            font-size: 1.2rem;
            color: #222;
        }

        .stat-card-global small {
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* GRID SERIE */
        .series-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px; padding: 20px;
        }

        .serie-card {
            background: white; border-radius: 15px;
            overflow: hidden; cursor: pointer;
            transition: 0.3s; border: 1px solid #eee;
            position: relative;
        }

        .serie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .serie-banner { 
            width: 100%; height: 160px; 
            background: #000; object-fit: cover; 
            display: block;
        }

        .serie-info { padding: 12px; }
        .serie-info h3 { 
            margin: 0 0 10px 0; color: #333; 
            font-size: 0.95rem; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .serie-stats {
            display: flex; gap: 15px; font-size: 0.8rem; color: #555;
            border-top: 1px solid #f9f9f9; padding-top: 10px;
        }

        .stat-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .stat-item i { color: #aaa; font-size: 0.9rem; }
        .stat-item i.fa-heart { color: var(--primary-color); }

        .status-badge {
            position: absolute; top: 12px; right: 12px;
            padding: 4px 10px; border-radius: 8px; 
            font-weight: bold; font-size: 0.7rem; color: white;
            z-index: 5;
        }
        .badge-price { background: var(--primary-color); }
        .badge-unlocked { background: var(--success-color); }

        @media (max-width: 600px) {
            .series-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
            .serie-banner { height: 100px !important; }
            .global-stats-container { gap: 8px; padding: 0 10px; }
            .stat-card-global { padding: 10px; }
            .stat-card-global span { font-size: 1rem; }
        }

        /* POPUP & LOADER */
        .custom-popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; align-items: center; justify-content: center; }
        .popup-content { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; }
        .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="customPopup" class="custom-popup">
    <div class="popup-content">
        <div id="pTitle" style="font-weight:bold; margin-bottom:10px;">Peye</div>
        <div id="pMsg" style="margin-bottom:20px; font-size:0.85rem; color:#666;">...</div>
        <div id="pBtns" style="display:flex; gap:10px;"></div>
    </div>
</div>

<span>  
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
  <script src="js/firebase.js"></script>
  <header class="app-header" id="header"></header>
</span>

<main class="main-content">
    <div id="homePage">
        <div style="height: 140px; display: flex; align-items: center; justify-content: center; text-align: center; background: #000; border-radius: 0 0 25px 25px; margin-bottom: 20px; color: white;">
            <div>
                <h1 style="color: var(--primary-color); font-size: 1.5rem; margin: 0;">RJFORDROID <span style="color:white">TV</span></h1>
                <p style="font-size: 0.75rem; opacity: 0.7;">Fòmasyon san limit an Kreyòl</p>
            </div>
        </div>

        <div class="global-stats-container">
            <div class="stat-card-global">
                <i class="fas fa-play"></i>
                <span id="globalEpisodes">0</span>
                <small>Epizòd</small>
            </div>
            <div class="stat-card-global">
                <i class="fas fa-heart"></i>
                <span id="globalLikes">0</span>
                <small>Likes</small>
            </div>
            <div class="stat-card-global">
                <i class="fas fa-comment-dots"></i>
                <span id="globalComments">0</span>
                <small>Kòmantè</small>
            </div>
        </div>

        <div id="mainLoader" style="padding:20px;"><div class="spinner"></div></div>
        <section class="series-grid" id="seriesContainer"></section>
    </div>
</main>

<script>
    const SERIE_COST = 50; 
    const seriesContainer = document.getElementById('seriesContainer');
    const mainLoader = document.getElementById('mainLoader');
    const uid = localStorage.getItem("connectedUID");

    async function loadSeries() {
        let unlockedSeries = {};
        if (uid) {
            const userSnap = await db.ref(`RJFORDROID/USERS/${uid}/unlockedSeries`).once("value");
            if (userSnap.exists()) unlockedSeries = userSnap.val();
        }

        db.ref('RJFORDROID/SERIES').on('value', (snapshot) => {
            seriesContainer.innerHTML = "";
            mainLoader.style.display = "none";
            const data = snapshot.val();
            
            if (data) {
                let totalG_Ep = 0;
                let totalG_Like = 0;
                let totalG_Comm = 0;

                Object.keys(data).forEach(key => {
                    const serie = data[key];
                    const isUnlocked = unlockedSeries[key] === true;
                    
                    let epCount = 0;
                    let likeCount = 0;
                    let commentCount = 0;

                    if (serie.EPISODES) {
                        const episodes = Object.values(serie.EPISODES);
                        epCount = episodes.length;
                        
                        episodes.forEach(ep => {
                            // Kalkile LIKES (si se chif oswa objè)
                            if (ep.likes) {
                                if (typeof ep.likes === 'number') {
                                    likeCount += ep.likes;
                                } else if (typeof ep.likes === 'object') {
                                    likeCount += Object.keys(ep.likes).length;
                                }
                            }

                            // Kalkile KOMANTÈ
                            if (ep.comments) {
                                if (typeof ep.comments === 'number') {
                                    commentCount += ep.comments;
                                } else if (typeof ep.comments === 'object') {
                                    commentCount += Object.keys(ep.comments).length;
                                }
                            }
                        });
                    }

                    totalG_Ep += epCount;
                    totalG_Like += likeCount;
                    totalG_Comm += commentCount;

                    createSerieCard(key, serie, isUnlocked, epCount, likeCount, commentCount);
                });

                document.getElementById('globalEpisodes').innerText = totalG_Ep;
                document.getElementById('globalLikes').innerText = totalG_Like;
                document.getElementById('globalComments').innerText = totalG_Comm;
            }
        });
    }

    function createSerieCard(id, data, isUnlocked, epCount, likeCount, commentCount) {
        const card = document.createElement('article');
        card.className = 'serie-card';
        card.onclick = () => handleSerieClick(id, isUnlocked);

        card.innerHTML = `
            <div class="status-badge ${isUnlocked ? 'badge-unlocked' : 'badge-price'}">
                ${isUnlocked ? '<i class="fas fa-check"></i> Deboke' : (data.price || SERIE_COST) + ' <i class="fas fa-coins"></i>'}
            </div>
            <img src="${data.banner || 'image/placeholder.jpg'}" class="serie-banner">
            <div class="serie-info">
                <h3>${data.titre}</h3>
                <div class="serie-stats">
                    <div class="stat-item"><i class="fas fa-video"></i> ${epCount}</div>
                    <div class="stat-item"><i class="fas fa-heart"></i> ${likeCount}</div>
                    <div class="stat-item"><i class="far fa-comment"></i> ${commentCount}</div>
                </div>
            </div>
        `;
        seriesContainer.appendChild(card);
    }

    async function handleSerieClick(serieId, alreadyUnlocked) {
        if (!uid) { showPopup("Atansyon", "Ou dwe konekte!"); return; }
        if (alreadyUnlocked) { window.location.href = `player.html?serie=${serieId}`; return; }
        // ... (Lojik peman ou deja genyen an)
    }

    function showPopup(title, msg) {
        document.getElementById('pTitle').innerText = title;
        document.getElementById('pMsg').innerText = msg;
        const btnContainer = document.getElementById('pBtns');
        btnContainer.innerHTML = `<button onclick="document.getElementById('customPopup').style.display='none'" style="flex:1; padding:10px; border:none; border-radius:8px; background:var(--primary-color); color:white; font-weight:bold;">OK</button>`;
        document.getElementById('customPopup').style.display = "flex";
    }

    loadSeries();
</script>

</body>
</html>
