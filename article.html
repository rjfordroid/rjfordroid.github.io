<script>

var urlParams = new URLSearchParams(window.location.search);
var id = urlParams.get("id");

if(id){

  var articleRef = db.ref("RJFORDROID/ARTICLES/" + id);

  articleRef.once("value", function(snapshot){

    if(snapshot.exists()){

      var data = snapshot.val();

      var fullUrl = window.location.href;

      // TITLE + META
      document.title = data.title + " | RJFORDROID";

      document.querySelector("meta[name='description']")
        .setAttribute("content", data.summary);

      document.getElementById("canonicalLink")
        .setAttribute("href", fullUrl);

      // Open Graph
      document.querySelector("meta[property='og:title']")
        .setAttribute("content", data.title);

      document.querySelector("meta[property='og:description']")
        .setAttribute("content", data.summary);

      document.querySelector("meta[property='og:image']")
        .setAttribute("content", data.image);

      document.querySelector("meta[property='og:url']")
        .setAttribute("content", fullUrl);

      // Twitter
      document.querySelector("meta[name='twitter:title']")
        .setAttribute("content", data.title);

      document.querySelector("meta[name='twitter:description']")
        .setAttribute("content", data.summary);

      document.querySelector("meta[name='twitter:image']")
        .setAttribute("content", data.image);

      // CONTENT
      document.getElementById("title").innerText = data.title;
      document.getElementById("meta").innerText =
        "Par " + data.author + " | " + data.date + " | " + data.views + " vues";

      document.getElementById("image").src = data.image;
      document.getElementById("content").innerHTML = data.description;

      // Structured Data
      var script = document.createElement("script");
      script.type = "application/ld+json";
      script.text = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Article",
        "headline": data.title,
        "image": data.image,
        "author": {
          "@type": "Person",
          "name": data.author
        },
        "publisher": {
          "@type": "Organization",
          "name": "RJFORDROID"
        },
        "datePublished": data.date,
        "dateModified": data.date,
        "description": data.summary,
        "mainEntityOfPage": fullUrl
      });

      document.head.appendChild(script);

      (adsbygoogle = window.adsbygoogle || []).push({});
      (adsbygoogle = window.adsbygoogle || []).push({});

    } else {
      document.getElementById("content").innerHTML =
        "<p>Article introuvable.</p>";
    }

  });

  // Incrémentation vues
  articleRef.child("views").transaction(function(current){
    return (current || 0) + 1;
  });

}

</script>
