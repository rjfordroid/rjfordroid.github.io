<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJFORDROID Chat & Actualités</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body, html { height: 100%; width: 100%; background-color: #f0f2f5; overflow: hidden; position: relative; }
        
        /* Styles du Popup Personnalisé */
        #custom-popup-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 5000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        #custom-popup {
            background: white; width: 90%; max-width: 400px; border-radius: 15px; padding: 25px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: popupShow 0.3s ease;
        }
        @keyframes popupShow { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #popup-message { font-size: 16px; color: #333; margin-bottom: 25px; line-height: 1.5; }
        .popup-btns { display: flex; gap: 10px; justify-content: center; }
        .popup-btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; min-width: 100px; }
        .btn-ok { background: #00a884; color: white; }
        .btn-cancel { background: #e0e0e0; color: #555; }
        .btn-ok:hover { background: #008f6f; }

        /* Login Screen */
        #login-screen { 
            background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            text-align: center; width: 90%; max-width: 350px; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;
        }
        #login-screen h2 { margin-bottom: 20px; color: #111b21; }
        #login-screen input { padding: 12px; width: 100%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #login-screen button { padding: 12px; width: 100%; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s;}
        #login-screen button:hover { background: #008f6f; }
        #error-msg { color: red; font-size: 14px; margin-bottom: 10px; display: none; }

        /* Loader Overlay */
        #loader {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white;
        }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #00a884; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* App Layout */
        #app { display: none; width: 100%; height: 100%; background: white; flex-direction: row; position: relative; overflow: hidden; }
        #menu-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; }

        /* Sidebar */
        #sidebar { width: 390px; background: #202c33; color: white; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; height: 100%; position:relative;}
        .sidebar-header { padding: 15px 20px; background: #111b21; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .logout-btn { position: absolute; right: 1px; top: 1px; background: #ff3b30; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold;}
        .logout-btn:hover { background: #cc2f26; }
        
        #user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #2a3942; transition: background 0.3s; display: flex; align-items: center; justify-content: space-between;}
        .user-item:hover, .user-item.active { background: #2a3942; }
        
        .user-info { display: flex; align-items: center; width: 100%; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #00a884, #008f6f); color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; position: relative; flex-shrink: 0; }
        .avatar-group { background: linear-gradient(135deg, #54656f, #202c33); font-size: 22px; }
        .user-details { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .user-name { font-weight: bold; font-size: 16px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .user-sub { font-size: 13px; color: #8696a0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .role-admin { background-color: #ff3b30; }
        .role-mod { background-color: #007aff; }

        .status-dot { position: absolute; bottom: 2px; right: 0px; height: 12px; width: 12px; border-radius: 50%; border: 2px solid #202c33; display: inline-block; }
        .sidebar-header .status-dot { border-color: #111b21; } 
        .online { background-color: #00a884; }
        .offline { background-color: #8696a0; }

        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75em; font-weight: bold; color: white; min-width: 24px; text-align: center; margin-left: 10px; flex-shrink: 0;}
        .unread-badge { background-color: #ff3b30; } 
        .read-badge { background-color: #8696a0; } 

        #chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; position: relative; height: 100%; min-width: 0; transition: transform 0.3s ease; }
        #chat-header { padding: 5px 10px; background: #f0f2f5; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #ccc; color: #111b21; display: flex; align-items: center; z-index: 10; }
        #menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #111b21; padding: 5px; margin-right: 15px; display: none; }
        .back-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 15px; color: #111b21; padding: 5px;}
        
        #news-filters { display: none; padding: 10px 15px; background: white; border-bottom: 1px solid #ccc; justify-content: space-between; gap: 10px; flex-shrink: 0; z-index: 9; overflow-x: auto;}
        .filter-btn { flex: 1; min-width: max-content; padding: 8px 12px; border: none; border-radius: 20px; background: #f0f2f5; color: #54656f; font-weight: bold; cursor: pointer; transition: background 0.3s, color 0.3s;}
        .filter-btn:hover { background: #e0e0e0; }
        .filter-btn.active { background: #00a884; color: white; }

        #messages { flex: 1; padding: 2px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        #pagination-controls { display: none; justify-content: center; gap: 15px; padding: 15px; background: #efeae2; flex-shrink: 0; border-top: 1px solid #ddd; }
        #pagination-controls button { padding: 8px 16px; border: none; border-radius: 5px; background: #00a884; color: white; font-weight: bold; cursor: pointer; }

        .msg { max-width: 90%; padding: 8px 12px; border-radius: 10px; position: relative; word-wrap: break-word; font-size: 15px; }
        .msg.other { background: white; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
        .msg.me { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
        .msg-sender { font-size: 0.8em; font-weight: bold; color: #029688; margin-bottom: 4px; }
        .msg.me .msg-sender { display: none; }
        .msg-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; object-fit: cover; display: block; background-color: #e0e0e0;}

        /* ======== CSS NEWS (ACTUALITÉS) ======== */
        .news-card { max-width: 99% !important; align-self: center !important; border-top-left-radius: 10px !important; width: 100%; margin-bottom: 15px; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .news-category-tag { display: inline-block; background: #00a884; color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        .news-tag { display: inline-block; background: #e0e0e0; color: #333; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; margin-right: 5px; font-style: italic; }
        .news-text { font-size: 15px; color: #333; line-height: 1.5; white-space: pre-wrap; transition: all 0.3s ease;}
        .text-truncated { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .text-expanded { display: block; }
        .read-more-btn { background: none; border: none; color: #00a884; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; padding: 0; outline: none; }
        .read-more-btn:hover { text-decoration: underline; }
        .news-actions { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #f0f2f5; padding-top: 15px; }
        .news-actions button { background: none; border: none; cursor: pointer; color: #54656f; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: bold; transition: color 0.2s;}
        .news-actions button span { background: #f0f2f5; padding: 2px 6px; border-radius: 10px; font-size: 12px; }

        .delete-btn { display: none; position: absolute; top: -10px; left: -10px; background: #ff3b30; color: white; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; cursor: pointer; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}
        .msg.me:hover .delete-btn { display: block; }

        /* ======== NOUVO CSS POU SERIES ======== */
        #series-area { display: none; flex: 1; overflow-y: auto; background: #f0f2f5; padding-bottom: 20px; }
        .series-header-banner { background: #000; border-radius: 0 0 25px 25px; padding: 30px 20px; text-align: center; color: white; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .series-header-banner h1 { color: #fe2c55; font-size: 1.8rem; margin: 0; }
        .series-header-banner span.tv { color: white; }
        .series-header-banner p { font-size: 0.85rem; opacity: 0.8; margin-top: 5px; }

        .global-stats-container { display: flex; justify-content: center; gap: 15px; padding: 0 20px; margin-bottom: 25px; }
        .stat-card-global { background: white; padding: 15px; border-radius: 15px; text-align: center; flex: 1; max-width: 150px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .stat-card-global i { display: block; font-size: 1.3rem; margin-bottom: 5px; color: #fe2c55; }
        .stat-card-global span { display: block; font-weight: 800; font-size: 1.2rem; color: #222; }
        .stat-card-global small { font-size: 0.65rem; color: #888; text-transform: uppercase; }

        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 20px; }
        .serie-card { background: white; border-radius: 15px; overflow: hidden; cursor: pointer; transition: transform 0.3s; border: 1px solid #eee; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .serie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .serie-banner { width: 100%; height: 160px; background: #000; object-fit: cover; display: block; }
        .serie-info { padding: 12px; }
        .serie-info h3 { margin: 0 0 10px 0; color: #333; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .serie-stats { display: flex; gap: 15px; font-size: 0.8rem; color: #555; border-top: 1px solid #f9f9f9; padding-top: 10px; }
        .stat-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; color: white; z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        .badge-price { background: #fe2c55; }
        .badge-unlocked { background: #25d366; }
        /* ====================================== */

        #input-area { padding: 10px 5px; background: #f0f2f5; display: flex; gap: 2px; align-items: center; position: relative; border-top: 1px solid #ccc; box-sizing: border-box; }
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; outline: none; transition: transform 0.2s; padding: 5px; color: #54656f;}
        
        #message-input { flex: 1; padding: 12px 15px; border: none; border-radius: 20px; outline: none; font-size: 15px; background: white;}
        #send-btn { padding: 10px 10px; background: #00a884; color: white; border: none; border-radius: 2px; cursor: pointer; font-weight: bold; font-size: 15px;}

        #admin-news-area { display: none; flex-direction: column; gap: 15px; padding: 20px; background: white; flex: 1; overflow-y: auto; }
        #admin-news-area input, #admin-news-area select, #admin-news-area textarea { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; background: #f0f2f5; }
        #admin-news-area button { padding: 12px; background: #00a884; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }

        #emoji-picker { display: none; position: absolute; bottom: 70px; left: 15px; background: white; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 280px; height: 200px; overflow-y: auto; padding: 10px; grid-template-columns: repeat(6, 1fr); gap: 5px; z-index: 1000; }
        .emoji-item { cursor: pointer; font-size: 22px; text-align: center; padding: 5px; border-radius: 5px; transition: background 0.2s;}

        @media (max-width: 768px) {
            #sidebar { position: absolute; top: 0; left: 0; width: 85%; max-width: 320px; height: 100%; z-index: 100; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
            #chat-area { width: 100%; position: absolute; z-index: 10; }
            #app.menu-active #sidebar { transform: translateX(0); }
            #app.menu-active #menu-overlay { display: block; }
            #menu-btn { display: block; }
            .series-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
            .serie-banner { height: 110px !important; }
            .global-stats-container { gap: 8px; padding: 0 10px; }
        }

        window.updateBadges = function() {
            document.querySelectorAll('.user-item').forEach(item => {
                const chatId = item.getAttribute('data-chatid');
                let badge = item.querySelector('.badge');
                if(!badge || !chatId || chatId === "ACTUALITE" || chatId === "ADMIN_PANEL" || chatId === "SERIES") return;
                
                let msgs = allChatsData[chatId] ? Object.values(allChatsData[chatId]) : [];
                let totalOther = msgs.filter(m => m.sender !== currentUser.username).length;
                let seen = JSON.parse(localStorage.getItem('seen_msgs_' + currentUser.username)) || {};
                
                if(currentChatId === chatId) { seen[chatId] = totalOther; localStorage.setItem('seen_msgs_' + currentUser.username, JSON.stringify(seen)); }
                let unread = totalOther - (seen[chatId] || 0);
                
                if(unread > 0) { badge.innerText = unread; badge.className = 'badge unread-badge'; badge.style.display = 'inline-block'; }
                else { badge.innerText = totalOther; badge.className = 'badge read-badge'; badge.style.display = totalOther > 0 ? 'inline-block' : 'none'; }
            });
        };

        function listenToNewsNotifications() {
            onValue(ref(db, 'RJFORDROID/ACTUALITE'), (snapshot) => {
                if (snapshot.exists()) {
                    const newsData = snapshot.val();
                    if (!isNewsLoaded) {
                        for (let key in newsData) initialNewsKeys.add(key);
                        isNewsLoaded = true;
                    } else {
                        for (let key in newsData) {
                            if (!initialNewsKeys.has(key)) {
                                initialNewsKeys.add(key);
                                notifSound.currentTime = 0; notifSound.play().catch(()=>{});
                                voyeNotifikasyonAndroid("📰 Nouvelle Actualité", newsData[key].title ? newsData[key].title : "Un nouvel article a été publié !");
                                showBrowserNotification("📰 Nouvelle Actualité", newsData[key].title || "Un nouvel article a été publié !");
                            }
                        }
                    }
                }
            });
        }

        window.setNewsCategory = (cat) => {
            currentNewsCategory = cat;
            if(currentUser) localStorage.setItem("rjfordroid_last_category_" + currentUser.username, cat);
            currentNewsPage = 1; updateFilterUI(); loadNews();
        };

        window.updateFilterUI = () => {
            newsFilters.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(currentNewsCategory) || (currentNewsCategory === 'Informatique' && btn.innerText.includes('Info')));
            });

        function loadNews() {
            onValue(ref(db, `RJFORDROID/ACTUALITE`), (snapshot) => {
                if (currentChatId !== "ACTUALITE") return; 
                allNewsItems = []; allKnownTags.clear();
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let key in data) {
                        const item = data[key]; item.id = key;
                        if(item.tags) item.tags.split(',').forEach(t => allKnownTags.add(t.trim().toLowerCase()));
                        if(item.category === currentNewsCategory) allNewsItems.push(item);
                    }
                    allNewsItems.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                }
                renderNewsPage();
            });
        }

        function renderNewsPage() {
            if (currentChatId !== "ACTUALITE") return;
            messagesDiv.innerHTML = allNewsItems.length === 0 ? "<div style='text-align:center; color:#8696a0; margin-top:20px;'>Aucune actualité.</div>" : "";
            const totalPages = Math.ceil(allNewsItems.length / NEWS_PER_PAGE);
            const start = (currentNewsPage - 1) * NEWS_PER_PAGE;
            allNewsItems.slice(start, start + NEWS_PER_PAGE).forEach(item => displayNews(item, item.id));
            paginationControls.style.display = totalPages > 1 ? "flex" : "none";
            if(totalPages > 1) paginationControls.innerHTML = `<button onclick="changeNewsPage(-1)" ${currentNewsPage === 1 ? 'disabled' : ''}>Précédent</button><span>Page ${currentNewsPage}/${totalPages}</span><button onclick="changeNewsPage(1)" ${currentNewsPage === totalPages ? 'disabled' : ''}>Suivant</button>`;
        }

        window.changeNewsPage = (d) => { currentNewsPage += d; renderNewsPage(); messagesDiv.scrollTop = 0; };

        function displayNews(item, key) {
            const div = document.createElement("div");
            div.className = `news-card`; 
            let tagsHtml = item.tags ? item.tags.split(',').map(t => `<span class="news-tag">#${t.trim()}</span>`).join('') : "";
            let imgHtml = item.imageUrl ? `<img src="${item.imageUrl}" style="width:100%; max-height:300px; object-fit:cover; border-radius:8px; margin-bottom:10px;" loading="lazy" />` : "";
            let textContent = item.text || "";
            let showBtn = textContent.length > 80;

            div.innerHTML = `
                <div style="margin-bottom:12px;"><span class="news-category-tag">${item.category}</span>${tagsHtml}</div>
                <div style="font-weight:bold; font-size:18px; margin-bottom:10px; color:#111b21;">${item.title || ""}</div>
                ${imgHtml}
                <div id="text-${key}" class="news-text text-truncated">${textContent}</div>
                ${showBtn ? `<button id="btn-${key}" class="read-more-btn" onclick="toggleReadMore('${key}')">Lire la suite...</button>` : ''}
                <div style="font-size:12px; color:#8696a0; text-align:right; margin-top:10px;">Publié le ${item.date || new Date(item.timestamp).toLocaleString()}</div>
                <div class="news-actions">
                    <button id="speak-btn-${key}" onclick="readTextAloud('${key}')">🔊 Lire</button>
                    <button onclick="voteNews('${key}', 'likes')">👍 <span>${item.likes || 0}</span></button>
                    <button onclick="voteNews('${key}', 'dislikes')">👎 <span>${item.dislikes || 0}</span></button>
                    <button onclick="shareNews('${key}', '${(item.title || "Actu").replace(/'/g, "\\'")}')">🔗 Partager <span>${item.shares || 0}</span></button>
                </div>
                ${(currentUser && (currentUser.isAdmin || currentUser.role === 'admin')) ? `<button onclick="deleteNews('${key}')" style="background:#ff3b30; color:white; border:none; padding:8px 10px; border-radius:5px; margin-top:15px; cursor:pointer; font-size:13px; width: 100%;">Supprimer</button>` : ''}`;
            messagesDiv.appendChild(div);
        }

        window.toggleReadMore = function(key) {
            document.querySelectorAll('.news-text.text-expanded').forEach(el => {
                if (el.id !== `text-${key}`) {
                    el.classList.remove('text-expanded'); el.classList.add('text-truncated');
                    let btn = document.getElementById(el.id.replace('text-', 'btn-'));
                    if (btn) btn.innerText = "Lire la suite...";
                }
            });
            let textContainer = document.getElementById(`text-${key}`);
            let btn = document.getElementById(`btn-${key}`);
            if (textContainer.classList.contains('text-truncated')) {
                textContainer.classList.remove('text-truncated'); textContainer.classList.add('text-expanded'); btn.innerText = "Voir moins";
            } else {
                textContainer.classList.add('text-truncated'); textContainer.classList.remove('text-expanded'); btn.innerText = "Lire la suite...";
            }

        window.voteNews = (key, type) => {
            get(ref(db, `RJFORDROID/ACTUALITE/${key}/voters_${type}/${currentUserKey}`)).then(snap => {
                if (snap.exists()) showPopup(`Déjà ${type === 'likes' ? 'liké' : 'disliké'}.`);
                else {
                    set(ref(db, `RJFORDROID/ACTUALITE/${key}/voters_${type}/${currentUserKey}`), true);
                    const countRef = ref(db, `RJFORDROID/ACTUALITE/${key}/${type}`);

        window.shareNews = (key, title) => {
            const currentNews = allNewsItems.find(i => i.id === key);
            let fullText = currentNews ? currentNews.text : "";
            
            let shortText = "";
            
            // Si tèks la gen plis pase 150 lèt, nou koupe l sèk
            if (fullText.length > 150) {
                shortText = fullText.substring(0, 150) + "...\n\nTélécharge l'app pour la suite";
            } else {
                // Si l pi kout pase 150, nou kite l jan l ye a
                shortText = fullText;
            }

            const content = `*${title}*\n\n${shortText}\n\nApp : https://rjfordroid.netlify.app/p/apps.html?nom=RJFlash`;
            
            // Lojik Firebase la (Pa chanje)
            get(ref(db, `RJFORDROID/ACTUALITE/${key}/voters_shares/${currentUserKey}`)).then(snap => {
                if (!snap.exists()) {
                    set(ref(db, `RJFORDROID/ACTUALITE/${key}/voters_shares/${currentUserKey}`), true);
                    const sRef = ref(db, `RJFORDROID/ACTUALITE/${key}/shares`);
                    get(sRef).then(s => set(sRef, (s.val() || 0) + 1)); addCredits(5);
                }
                if (typeof AndroidControler !== "undefined" && AndroidControler.shareToAndroid) AndroidControler.shareToAndroid(title, content);
                else if (navigator.share) navigator.share({ title, text: content }).catch(() => {});
                else { navigator.clipboard.writeText(content); showPopup("Lien copié !"); }
            });
        };



        window.speakingKey = null;
      window.readTextAloud = function(key) {
            let text = document.getElementById(`text-${key}`).innerText;
            let btn = document.getElementById(`speak-btn-${key}`);

            if (window.isSpeaking === key) {
                if (typeof AndroidControler !== "undefined") AndroidControler.stopSpeak();
                window.isSpeaking = null;
                btn.innerHTML = "🔊 Lire";
            } else {
                if (typeof AndroidControler !== "undefined") {
                    AndroidControler.speak(text);
                    window.isSpeaking = key;
                    btn.innerHTML = "⏹️ Stop";
                }
            }
        };
        sendNewsBtn.addEventListener("click", () => {
            const title = newsTitleInput.value.trim(), category = newsCategoryInput.value, text = newsContentInput.value.trim(), tags = newsTagsInput.value.trim(), file = newsFileInput.files[0];
            if(!title && !text && !file) return showPopup("Remplissez les champs.");
            if(file) {
                loader.style.display = "flex";
                const reader = new FileReader();
                reader.onload = () => {
                    const formData = new FormData();
                    formData.append("file", reader.result.split(",")[1]); formData.append("name", file.name); formData.append("type", file.type);
                    fetch("https://script.google.com/macros/s/AKfycbxHjVBNTOlj6xBUp_fl-aVbPSFZRiMQB77_YIvFeB79uq2Hx9P_r7HADZTYj9WElsXkug/exec", { method: "POST", body: formData })
                    .then(r => r.json()).then(res => {
                        loader.style.display = "none"; if(!res.success) return showPopup("Erreur upload.");
                        const id = res.url.match(/\/d\/([^\/]+)/)?.[1] || "";
                        push(ref(db, `RJFORDROID/ACTUALITE`), { title, category, tags, text, imageUrl: id ? `https://drive.google.com/thumbnail?id=${id}&sz=w600` : "", fullUrl: res.url, timestamp: serverTimestamp(), author: currentUser.username, likes: 0, dislikes: 0, shares: 0 }).then(() => { newsTitleInput.value = ""; newsContentInput.value = ""; newsFileInput.value = ""; showPopup("Publié avec succès !"); });
                    }).catch(() => { loader.style.display = "none"; showPopup("Erreur serveur."); });
                };
                reader.readAsDataURL(file);
            } else {
                push(ref(db, `RJFORDROID/ACTUALITE`), { title, category, tags, text, imageUrl: "", fullUrl: "", timestamp: serverTimestamp(), author: currentUser.username, likes: 0, dislikes: 0, shares: 0 }).then(() => { newsTitleInput.value = ""; newsContentInput.value = ""; showPopup("Publié avec succès !"); });
            }
        });
        // #endregion


        // #region 8 - LOGIQUE SÉRIES VIDÉOS (Series TV)
        window.loadSeries = async function() {
            if (!currentUserKey) return;
            let unlockedSeries = {};
            try {
                const userSnap = await get(ref(db, `RJFORDROID/USERS/${currentUserKey}/unlockedSeries`));
                if (userSnap.exists()) unlockedSeries = userSnap.val();
            } catch (e) { console.error("Err:", e); }

            onValue(ref(db, 'RJFORDROID/SERIES'), (snapshot) => {
                seriesContainer.innerHTML = "";
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    let totalG_Ep = 0; let totalG_Like = 0; let totalG_Comm = 0;

                    for(let key in data) {
                        const serie = data[key];
                        const isUnlocked = unlockedSeries[key] === true;
                        let epCount = 0; let likeCount = 0; let commentCount = 0;

                        if (serie.EPISODES) {
                            const episodes = Object.values(serie.EPISODES);
                            epCount = episodes.length;
                            episodes.forEach(ep => {
                                if (ep.likes) likeCount += (typeof ep.likes === 'number') ? ep.likes : Object.keys(ep.likes).length;
                                if (ep.comments) commentCount += (typeof ep.comments === 'number') ? ep.comments : Object.keys(ep.comments).length;
                            });
                        }
                        totalG_Ep += epCount; totalG_Like += likeCount; totalG_Comm += commentCount;
                        createSerieCard(key, serie, isUnlocked, epCount, likeCount, commentCount);
                    }
                    document.getElementById('globalEpisodes').innerText = totalG_Ep;
                    document.getElementById('globalLikes').innerText = totalG_Like;
                    document.getElementById('globalComments').innerText = totalG_Comm;
                }
            });
        };

        function createSerieCard(id, data, isUnlocked, epCount, likeCount, commentCount) {
            const card = document.createElement('article');
            card.className = 'serie-card';
            card.onclick = () => handleSerieClick(id, isUnlocked);
            card.innerHTML = `
                <div class="status-badge ${isUnlocked ? 'badge-unlocked' : 'badge-price'}">
                    ${isUnlocked ? '✔️ Deboke' : (data.price || SERIE_COST) + ' 💰'}
                </div>
                <img src="${data.banner || 'https://via.placeholder.com/300x160?text=No+Image'}" class="serie-banner">
                <div class="serie-info">
                    <h3>${data.titre}</h3>
                    <div class="serie-stats">
                        <div class="stat-item">▶️ ${epCount}</div>
                        <div class="stat-item">❤️ ${likeCount}</div>
                        <div class="stat-item">💬 ${commentCount}</div>
                    </div>
                </div>
            `;
            seriesContainer.appendChild(card);
        }

        window.handleSerieClick = async function(serieId, alreadyUnlocked) {
            if (alreadyUnlocked) {
                window.location.href = `player.html?serie=${serieId}`;
                return;
            }
            try {
                const serieSnap = await get(ref(db, `RJFORDROID/SERIES/${serieId}`));
                if(!serieSnap.exists()) return;
                const serieData = serieSnap.val();
                
                const episodes = serieData.EPISODES ? Object.keys(serieData.EPISODES) : [];
                if (episodes.length === 0) {
                    showPopup("Bientôt disponible: Seri sa a poko gen epizòd ladan l. Rete branche!"); return;
                }

                const REAL_COST = serieData.price || SERIE_COST;
                const userSnap = await get(ref(db, `RJFORDROID/USERS/${currentUserKey}`));
                const userCredits = userSnap.val().credits || 0;

                if (userCredits < REAL_COST) {
                    showPopup(`Kredi Enfisiyan : Ou bezwen ${REAL_COST} kredi pou deboke seri sa a. Ou gen sèlman ${userCredits} kredi.`); return;
                }

                showPopup(`Èske ou vle deboke "${serieData.titre}" pou ${REAL_COST} kredi?`, true, async () => {
                    const updates = {};
                    updates[`RJFORDROID/USERS/${currentUserKey}/credits`] = userCredits - REAL_COST;
                    updates[`RJFORDROID/USERS/${currentUserKey}/unlockedSeries/${serieId}`] = true;
                    await update(ref(db), updates);
                    showPopup("Seri a deboke ak siksè! Prale nan player...");
                    
                    currentUser.credits = userCredits - REAL_COST;
                    if(!currentUser.unlockedSeries) currentUser.unlockedSeries = {};
                    currentUser.unlockedSeries[serieId] = true;
                    localStorage.setItem("rjfordroid_session", JSON.stringify({ key: currentUserKey, data: currentUser }));
                    refreshMyInfoUI();

                    setTimeout(() => { window.location.href = `player.html?serie=${serieId}`; }, 1500);
                });
            } catch (e) { console.error(e); showPopup("Erè: Gen yon pwoblèm ki rive. Tanpri eseye ankò."); }
        };
        // #endregion


        // #region 9 - LOGIQUE CHAT & MESSAGERIE (Group & Private)
        function listenToAllChats() {
            onValue(ref(db, 'RJFORDROID/CHAT_USERS'), (snapshot) => {
                allChatsData = snapshot.exists() ? snapshot.val() : {};
                const now = Date.now();
                for(let chatId in allChatsData) {
                    const messages = allChatsData[chatId];
                    let validMsgs = [];
                    for(let messageKey in messages) {
                        const msg = messages[messageKey];
                        if(msg.timestamp && (now - msg.timestamp > 86400000)) remove(ref(db, `RJFORDROID/CHAT_USERS/${chatId}/${messageKey}`));
                        else validMsgs.push(msg);
                    }
                    const count = validMsgs.length;
                    if (previousMessageCounts[chatId] !== undefined && count > previousMessageCounts[chatId]) {
                        const lastMsg = validMsgs[validMsgs.length - 1];
                        if (isAppLoaded && lastMsg && lastMsg.sender !== currentUser.username) {
                            notifSound.currentTime = 0; notifSound.play().catch(()=>{});
                            voyeNotifikasyonAndroid("Mesaj soti nan " + lastMsg.sender, lastMsg.text ? lastMsg.text : "📸 Imaj resevwa");
                            showBrowserNotification("Nouveau message de " + lastMsg.sender, lastMsg.text ? lastMsg.text : "📸 Image reçue");
                        }
                    }
                    previousMessageCounts[chatId] = count;
                }
                updateBadges(); 
            });
        }

        function loadChat(chatId) {
            onValue(ref(db, `RJFORDROID/CHAT_USERS/${chatId}`), (snapshot) => {
                if (currentChatId !== chatId) return;
                messagesDiv.innerHTML = "";
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    for (let key in data) displayMessage(data[key], key);
                }
            });
        }

        function displayMessage(msg, key) {
            const div = document.createElement("div");
            const isMe = msg.sender === currentUser.username;
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `
                ${isMe ? `<div class="delete-btn" onclick="deleteMessage('${key}')">🗑️</div>` : ''}
                <div class="msg-sender">${msg.sender}</div>
                ${msg.imageUrl ? `<img src="${msg.imageUrl}" class="msg-img" onclick="window.open('${msg.fullUrl || msg.imageUrl}', '_blank')" />` : ''}
                ${msg.text ? `<div class="msg-text">${msg.text}</div>` : ''}`;
            messagesDiv.appendChild(div);
            if(currentChatId !== "ACTUALITE" && currentChatId !== "SERIES") setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 100);
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;
            push(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}`), { sender: currentUser.username, text: text, timestamp: serverTimestamp() });
            messageInput.value = ""; emojiPicker.style.display = 'none';
        }

        sendBtn.addEventListener("click", sendMessage);
        messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
        window.deleteMessage = (key) => showPopup("Effacer ce message ?", true, () => remove(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}/${key}`)));

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0]; if (!file) return;
            loader.style.display = "flex";
            const reader = new FileReader();
            reader.onload = () => {
                const formData = new FormData(); formData.append("file", reader.result.split(",")[1]);
                formData.append("name", file.name); formData.append("type", file.type);
                fetch("https://script.google.com/macros/s/AKfycbxHjVBNTOlj6xBUp_fl-aVbPSFZRiMQB77_YIvFeB79uq2Hx9P_r7HADZTYj9WElsXkug/exec", { method: "POST", body: formData })
                .then(r => r.json()).then(res => {
                    loader.style.display = "none"; fileInput.value = "";
                    if (!res.success) return showPopup("Erreur upload.");
                    const id = res.url.match(/\/d\/([^\/]+)/)?.[1];
                    if(id) push(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}`), { sender: currentUser.username, text: "", imageUrl: `https://drive.google.com/thumbnail?id=${id}&sz=w600`, fullUrl: res.url, timestamp: serverTimestamp() });
                }).catch(() => { loader.style.display = "none"; showPopup("Erreur serveur."); });
            };
            reader.readAsDataURL(file);
        });
        // #endregion


        // #region 10 - EMOJI PICKER SETUP
        const emojis = ['😀','😂','🤣','😊','😍','🥰','😎','🤓','😭','😤','😡','🤬','🤯','🥶','🥵','🥳','🤔','🙄','🤫','🤥','😴','🤢','🤮','🤠','😈','👻','💩','👽','🤖','🎃','🫶','👍','👎','👊','✌️','🤞','🤟','🤘','👌','🤌','🤏','👇','👆','👉','👈','🙏','💪','🧠','👀','👅','💋','🔥','✨','🎉','💯','❤️','💔','🎈','🎁','👑'];

        emojis.forEach(emoji => {
            let span = document.createElement('span');
            span.className = 'emoji-item';
            span.innerText = emoji;
            span.onclick = () => {
                messageInput.value += emoji; 
                emojiPicker.style.display = 'none'; 
                messageInput.focus();
            };
            emojiPicker.appendChild(span);
        });

        emojiBtn.addEventListener("click", () => {
            emojiPicker.style.display = emojiPicker.style.display === "grid" ? "none" : "grid";
        });
        // #endregion
    </script>
