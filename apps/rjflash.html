<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RJFORDROID Chat & Actualités</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: normal; }
        body, html { height: 100%; width: 100%; background-color: #f0f2f5; overflow: hidden; position: relative; }
        
        h1,h2,h3,h4,h5,h6{ margin:5px; }
        p{ margin:0px; padding:0px; line-height: normal; }
        ul{ margin: 0px 10px; padding:0px 10px; }
        
        /* Styles du Popup Personnalisé */
        #custom-popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 5000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        #custom-popup { background: white; width: 90%; max-width: 400px; border-radius: 15px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: popupShow 0.3s ease; }
        @keyframes popupShow { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #popup-message { font-size: 16px; color: #333; margin-bottom: 25px; line-height: 1.5; }
        .popup-btns { display: flex; gap: 10px; justify-content: center; }
        .popup-btn { padding: 10px 25px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; min-width: 100px; }
        .btn-ok { background: #00a884; color: white; }
        .btn-cancel { background: #e0e0e0; color: #555; }
        .btn-ok:hover { background: #008f6f; }

        /* Login Screen */
        #login-screen { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; }
        #login-screen h2 { margin-bottom: 20px; color: #111b21; }
        #login-screen input { padding: 12px; width: 100%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        #login-screen button { padding: 12px; width: 100%; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background 0.3s;}
        #login-screen button:hover { background: #008f6f; }
        #error-msg { color: red; font-size: 14px; margin-bottom: 10px; display: none; }

        /* Loader Overlay */
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #00a884; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* App Layout */
        #app { display: none; width: 100%; height: 100%; background: white; flex-direction: row; position: relative; overflow: hidden; }
        #menu-overlay { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 90; }

        /* Sidebar */
        #sidebar { width: 390px; background: #202c33; color: white; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s ease; height: 100%; position:relative;}
        .sidebar-header { padding: 15px 20px; background: #111b21; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .logout-btn { position: absolute; right: 1px; top: 1px; background: #ff3b30; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-size: 0.8em; font-weight: bold;}
        .logout-btn:hover { background: #cc2f26; }
        
        #user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #2a3942; transition: background 0.3s; display: flex; align-items: center; justify-content: space-between;}
        .user-item:hover, .user-item.active { background: #2a3942; }
        
        /* Dropdown Styles pou Menu Sèvis yo */
        .dropdown-container { display: none; background: #162026; }
        .dropdown-container .user-item { padding-left: 35px; border-bottom: 1px solid #1a252b; }
        .dropdown-container .avatar { width: 38px; height: 38px; font-size: 18px; margin-right: 12px; }
        .dropdown-btn { background: #1a252b; border-bottom: 1px solid #2a3942; }
        
        .user-info { display: flex; align-items: center; width: 100%; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #00a884, #008f6f); color: white; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin-right: 15px; position: relative; flex-shrink: 0; }
        .avatar-group { background: linear-gradient(135deg, #54656f, #202c33); font-size: 22px; }
        .user-details { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .user-name { font-weight: bold; font-size: 16px; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
        .user-sub { font-size: 13px; color: #8696a0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; color: white; font-weight: bold; text-transform: uppercase; }
        .role-admin { background-color: #ff3b30; }
        .role-mod { background-color: #007aff; }

        .status-dot { position: absolute; bottom: 2px; right: 0px; height: 12px; width: 12px; border-radius: 50%; border: 2px solid #202c33; display: inline-block; }
        .sidebar-header .status-dot { border-color: #111b21; } 
        .online { background-color: #00a884; }
        .offline { background-color: #8696a0; }

        .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75em; font-weight: bold; color: white; min-width: 24px; text-align: center; margin-left: 10px; flex-shrink: 0;}
        .unread-badge { background-color: #ff3b30; } 
        .read-badge { background-color: #8696a0; } 

        #chat-area { flex: 1; display: flex; flex-direction: column; background: #efeae2; position: relative; height: 100%; min-width: 0; transition: transform 0.3s ease; }
        #chat-header { padding: 5px 10px; background: #f0f2f5; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #ccc; color: #111b21; display: flex; align-items: center; z-index: 10; }
        #menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: #111b21; padding: 5px; margin-right: 15px; display: none; }
        .back-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 15px; color: #111b21; padding: 5px;}
        
        #news-filters { display: none; padding: 10px 15px; background: white; border-bottom: 1px solid #ccc; justify-content: space-between; gap: 10px; flex-shrink: 0; z-index: 9; overflow-x: auto;}
        .filter-btn { flex: 1; min-width: max-content; padding: 8px 12px; border: none; border-radius: 20px; background: #f0f2f5; color: #54656f; font-weight: bold; cursor: pointer; transition: background 0.3s, color 0.3s;}
        .filter-btn:hover { background: #e0e0e0; }
        .filter-btn.active { background: #00a884; color: white; }

        #lang-filters { display: none; padding: 10px 15px; background: white; border-bottom: 1px solid #ccc; justify-content: space-between; gap: 10px; flex-shrink: 0; z-index: 9; overflow-x: auto;}

        #messages { flex: 1; padding: 2px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        #pagination-controls { display: none; justify-content: center; gap: 15px; padding: 15px; background: #efeae2; flex-shrink: 0; border-top: 1px solid #ddd; }
        #pagination-controls button { padding: 8px 16px; border: none; border-radius: 5px; background: #00a884; color: white; font-weight: bold; cursor: pointer; }

        .msg { max-width: 90%; padding: 8px 12px; border-radius: 10px; position: relative; word-wrap: break-word; font-size: 15px; }
        .msg.other { background: white; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
        .msg.me { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
        .msg-sender { font-size: 0.8em; font-weight: bold; color: #029688; margin-bottom: 4px; }
        .msg.me .msg-sender { display: none; }
        .msg-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; object-fit: cover; display: block; background-color: #e0e0e0;}

        /* CSS NEWS & LANG */
        .news-card { max-width: 99% !important; align-self: center !important; border-top-left-radius: 10px !important; width: 100%; margin-bottom: 15px; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .news-category-tag { display: inline-block; background: #00a884; color: white; padding: 4px 10px; border-radius: 15px; font-size: 11px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; margin-right: 5px; }
        .news-tag { display: inline-block; background: #e0e0e0; color: #333; padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; margin-right: 5px; font-style: italic; }
        .news-text { font-size: 15px; color: #333; line-height: 1.5; white-space: pre-wrap; transition: all 0.3s ease;}
        .text-truncated { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .text-expanded { display: block; }
        .read-more-btn { background: none; border: none; color: #00a884; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 5px; padding: 0; outline: none; }
        .read-more-btn:hover { text-decoration: underline; }
        .news-actions { display: flex; justify-content: space-between; margin-top: 15px; border-top: 1px solid #f0f2f5; padding-top: 15px; }
        .news-actions button { background: none; border: none; cursor: pointer; color: #54656f; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: bold; transition: color 0.2s;}
        .news-actions button span { background: #f0f2f5; padding: 2px 6px; border-radius: 10px; font-size: 12px; }

        .delete-btn { display: none; position: absolute; top: -10px; left: -10px; background: #ff3b30; color: white; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; cursor: pointer; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 10;}
        .msg.me:hover .delete-btn { display: block; }

        /* CSS SERIES */
        #series-area { display: none; flex: 1; overflow-y: auto; background: #f0f2f5; padding-bottom: 20px; }
        .series-header-banner { background: #000; border-radius: 0 0 25px 25px; padding: 30px 20px; text-align: center; color: white; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .series-header-banner h1 { color: #fe2c55; font-size: 1.8rem; margin: 0; }
        .series-header-banner span.tv { color: white; }
        .series-header-banner p { font-size: 0.85rem; opacity: 0.8; margin-top: 5px; }

        .global-stats-container { display: flex; justify-content: center; gap: 15px; padding: 0 20px; margin-bottom: 25px; }
        .stat-card-global { background: white; padding: 15px; border-radius: 15px; text-align: center; flex: 1; max-width: 150px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .stat-card-global i { display: block; font-size: 1.3rem; margin-bottom: 5px; color: #fe2c55; }
        .stat-card-global span { display: block; font-weight: 800; font-size: 1.2rem; color: #222; }
        .stat-card-global small { font-size: 0.65rem; color: #888; text-transform: uppercase; }

        .series-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 0 20px; }
        .serie-card { background: white; border-radius: 15px; overflow: hidden; cursor: pointer; transition: transform 0.3s; border: 1px solid #eee; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        .serie-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .serie-banner { width: 100%; height: auto; background: #000; object-fit: cover; display: block; }
        .serie-info { padding: 12px; }
        .serie-info h3 { margin: 0 0 10px 0; color: #333; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .serie-stats { display: flex; gap: 15px; font-size: 0.8rem; color: #555; border-top: 1px solid #f9f9f9; padding-top: 10px; }
        .stat-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
        .status-badge { position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 8px; font-weight: bold; font-size: 0.75rem; color: white; z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        .badge-price { background: #fe2c55; }
        .badge-unlocked { background: #25d366; }
        
        /* CSS PDF / EBOOKS */
        #pdf-area { display: none; flex: 1; overflow-y: auto; background: #f0f2f5; padding-bottom: 20px; }
        .pdf-header-banner { background: #005bb5; border-radius: 0 0 25px 25px; padding: 30px 20px; text-align: center; color: white; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .pdf-header-banner h1 { color: #fff; font-size: 1.8rem; margin: 0; }
        .pdf-header-banner p { font-size: 0.85rem; opacity: 0.9; margin-top: 5px; }

        .pdf-action-btns { display: flex; gap: 10px; margin-bottom: 15px; }
        .pdf-action-btns button { flex: 1; padding: 10px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; font-size: 14px;}
        .btn-read { background: #007aff; }
        .btn-read:hover { background: #005bb5; }
        .btn-download { background: #00a884; }
        .btn-download:hover { background: #008f6f; }
        .pdf-social { display: flex; justify-content: space-around; margin-bottom: 15px; border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 10px 0; }
        .pdf-social button { background: none; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; gap: 5px; color: #555; font-weight:bold; outline: none;}
        .pdf-comments-section { text-align: left; max-height: 180px; overflow-y: auto; background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 15px; border: 1px solid #eee;}
        .pdf-comment { margin-bottom: 8px; font-size: 13px; border-bottom: 1px solid #eee; padding-bottom: 5px; word-wrap: break-word;}
        .pdf-comment strong { color: #00a884; }
        .pdf-comment-input-area { display: flex; gap: 5px; }
        .pdf-comment-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline:none; font-size: 13px;}
        .pdf-comment-input-area button { padding: 10px 15px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight:bold;}

        #input-area { padding: 10px 5px; background: #f0f2f5; display: flex; gap: 2px; align-items: center; position: relative; border-top: 1px solid #ccc; box-sizing: border-box; }
        .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; outline: none; transition: transform 0.2s; padding: 5px; color: #54656f;}
        
        #message-input { flex: 1; padding: 12px 15px; border: none; border-radius: 20px; outline: none; font-size: 15px; background: white;}
        #send-btn { padding: 10px 10px; background: #00a884; color: white; border: none; border-radius: 2px; cursor: pointer; font-weight: bold; font-size: 15px;}

        #emoji-picker { display: none; position: absolute; bottom: 70px; left: 15px; background: white; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); width: 280px; height: 200px; overflow-y: auto; padding: 10px; grid-template-columns: repeat(6, 1fr); gap: 5px; z-index: 1000; }
        .emoji-item { cursor: pointer; font-size: 22px; text-align: center; padding: 5px; border-radius: 5px; transition: background 0.2s;}

        @media (max-width: 768px) {
            #sidebar { position: absolute; top: 0; left: 0; width: 85%; max-width: 320px; height: 100%; z-index: 100; transform: translateX(-100%); transition: transform 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.3); }
            #chat-area { width: 100%; position: absolute; z-index: 10; }
            #app.menu-active #sidebar { transform: translateX(0); }
            #app.menu-active #menu-overlay { display: block; }
            #menu-btn { display: block; }
            .series-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 0 10px; }
            .serie-banner { height: auto !important; min-height:250px; }
            .global-stats-container { gap: 8px; padding: 0 10px; }
        }
        
        .overlay { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); }
        .popup-content { background-color: #fff; margin: 10% auto; padding: 20px; width: 90%; max-width: 400px; border-radius: 10px; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .close-btn { position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer; color: #333; }
        #signupForm input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        #signupForm button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
 
<body>

    <div id="custom-popup-overlay">
        <div id="custom-popup">
            <p id="popup-message"></p>
            <div class="popup-btns">
                <button id="popup-confirm-btn" class="popup-btn btn-ok">OK</button>
                <button id="popup-cancel-btn" class="popup-btn btn-cancel" style="display:none;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- Popup Ebook / PDF Refait avec Nouvelles Options 100vh wote ak laje epi scroll -->
    <div id="ebookModal" class="overlay">
        <div class="popup-content" style="text-align: center; margin: 0; width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0; overflow-y: auto; display: block; box-sizing: border-box; background: white; padding-bottom: 30px;">
            
            <!-- Sticky header with Back button logic untouched -->
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; position: sticky; top: 0; background: #fff; padding: 15px 0; z-index: 20; border-bottom: 1px solid #eee;">
                <span id="closeEbookModal" style="font-size: 24px; cursor: pointer; color: #333; margin-left: 5px;">⬅️</span>
                <span style="font-weight: bold; font-size: 16px;">Détails du document</span>
                <div style="width: 24px; margin-right: 5px;"></div>
            </div>
            
            <img id="ebookModalImg" src="" style="width: 100%; max-height: 250px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; background: #e0e0e0;">
            <h3 id="ebookModalTitle" style="margin-bottom: 10px; color: #111b21;"></h3>
            <p id="ebookModalDesc" style="font-size: 14px; color: #555; margin-bottom: 15px; white-space: pre-wrap; text-align: left;"></p>
            
            <div id="ebookLockedView">
                <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px;" id="ebookModalPrice"></div>
                <button id="ebookModalActionBtn" style="width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer;"></button>
            </div>

            <div id="ebookUnlockedView" style="display:none;">
                <div class="pdf-action-btns">
                    <button class="btn-read" id="btn-read-pdf">📖 Lire sur l'app</button>
                    <button class="btn-download" id="btn-download-pdf">📥 Télécharger</button>
                </div>

                <div class="pdf-social">
                    <button id="btn-like-pdf">👍 <span id="pdf-likes-count">0</span></button>
                    <button id="btn-dislike-pdf">👎 <span id="pdf-dislikes-count">0</span></button>
                </div>

                <div class="pdf-comments-section" id="pdf-comments-list"></div>
                
                <div class="pdf-comment-input-area">
                    <input type="text" id="pdf-comment-input" placeholder="Ajouter un commentaire...">
                    <button id="btn-send-pdf-comment">Envoyer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Interface Plein Écran pour Lire le PDF 100vh ak defileman -->
    <div id="pdf-reader-overlay" class="overlay" style="z-index: 6000; padding: 0; margin: 0; width: 100vw; height: 100vh;">
        <div style="width:100%; height:100%; display:flex; flex-direction:column; background:white;">
            <div id="pdf-reader-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #111b21; color: white; flex-shrink: 0;">
                <button onclick="closePdfReader()" style="background: transparent; color: white; border: none; font-size: 20px; cursor: pointer; margin-right: 10px;">⬅️</button>
                <span id="pdf-reader-title" style="font-size: 16px; font-weight: bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 70%; text-align: center; flex: 1;">Document</span>
                <div style="width: 30px;"></div>
            </div>
            <!-- Div scrollable pour l'iframe -->
            <div style="flex:1; width:100%; overflow-y:auto; -webkit-overflow-scrolling: touch;">
                <iframe id="pdf-iframe" src="" style="border:none; width:100%; height:100%; min-height: 100vh; background: #f0f2f5;"></iframe>
            </div>
        </div>
    </div>

    <audio id="notification-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

    <div id="loader"><div class="spinner"></div><p>Aksyon ap fèt, tann yon ti moman...</p></div>

    <div id="login-screen">
        <h2>Connexion</h2>
        <div id="error-msg">Identifiant ou mot de passe incorrect.</div>
        <input type="text" id="identifier-input" placeholder="Username ou Téléphone" />
        <input type="password" id="password-input" placeholder="Mot de passe" />
        <button id="login-btn">Se connecter</button><br><br>
        <button id="openSignup">Enskri kounye a</button>
    </div>

    <div id="signupOverlay" class="overlay">
      <div class="popup-content">
        <span id="closePopup" class="close-btn">&times;</span>
        <h3>Kreye yon kont</h3>
        <form id="signupForm">
            <input type="text" id="fullName" placeholder="Nom complet" required>
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="email" id="email" placeholder="Email" required>

                        card.innerHTML = `<div class="status-badge ${isUnlocked ? 'badge-unlocked' : 'badge-price'}">${isUnlocked ? '✔️ Deboke' : REAL_COST + ' 💰'}</div><img src="${imgSrc}" class="serie-banner"><div class="serie-info"><h3>${doc.Titre}</h3><p style="font-size: 12px; color: #666; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${doc.desc || ''}</p><div style="font-size: 11px; color: #888;">Publié le: ${doc.Date || ''}</div></div>`;
                        pdfContainer.appendChild(card);
                    }
                } else pdfContainer.innerHTML = "<p style='text-align:center; width:100%; grid-column: 1 / -1;'>Aucun document disponible.</p>";
            });
        };

        window.handlePdfClick = async function(pdfId, doc, alreadyUnlocked, cost) {
            const modal = document.getElementById("ebookModal");
            const img = document.getElementById("ebookModalImg");
            const title = document.getElementById("ebookModalTitle");
            const desc = document.getElementById("ebookModalDesc");
            
            const lockedView = document.getElementById("ebookLockedView");
            const unlockedView = document.getElementById("ebookUnlockedView");
            const priceDiv = document.getElementById("ebookModalPrice");
            const actionBtn = document.getElementById("ebookModalActionBtn");

            // Nettoyage de l'ancien listener realtime
            if(window.pdfRealtimeUnsubscribe) {
                window.pdfRealtimeUnsubscribe();
                window.pdfRealtimeUnsubscribe = null;
            }

            let imgSrc = 'https://via.placeholder.com/300x160?text=PDF+DOC';
            if (doc.image && doc.image !== "None") {
                if (doc.image.startsWith('http')) imgSrc = doc.image;
                else imgSrc = `https://drive.google.com/thumbnail?id=${doc.image}&sz=w300`;
            }
            img.src = imgSrc;
            title.innerText = doc.Titre || "San Tit";
            desc.innerText = doc.desc || "Pa gen deskripsyon pou dokiman sa a.";

            if (alreadyUnlocked) {
                // AFFICHAGE DEBLOQUÉ
                lockedView.style.display = "none";
                unlockedView.style.display = "block";
                img.style.maxHeight = "150px"; 
                
                document.getElementById('btn-read-pdf').onclick = () => readPdfInApp(doc.Url, doc.Titre);
                document.getElementById('btn-download-pdf').onclick = () => window.open(doc.Url, '_blank');
                document.getElementById('btn-like-pdf').onclick = () => votePdf(pdfId, 'like');
                document.getElementById('btn-dislike-pdf').onclick = () => votePdf(pdfId, 'dislike');
                document.getElementById('btn-send-pdf-comment').onclick = () => sendPdfComment(pdfId);

                // Écouteur en temps réel pour Likes et Commentaires du PDF
                const pdfRef = ref(db, `RJFORDROID/pdf/${pdfId}`);
                window.pdfRealtimeUnsubscribe = onValue(pdfRef, (snap) => {
                    if (!snap.exists()) return;
                    const data = snap.val();
                    document.getElementById('pdf-likes-count').innerText = data.likes || 0;
                    document.getElementById('pdf-dislikes-count').innerText = data.dislikes || 0;
                    
                    const commentsList = document.getElementById('pdf-comments-list');
                    if (data.comments) {
                        commentsList.innerHTML = Object.values(data.comments).map(c => `
                            <div class="pdf-comment"><strong>${c.user}</strong>: ${c.text}</div>
                        `).join('');
                        
                    } else {
                        commentsList.innerHTML = "<div style='color:#888; font-size:12px; padding:10px;'>Aucun commentaire. Soyez le premier!</div>";
                    }
                });

            } else {
                // AFFICHAGE VERROUILLÉ
                lockedView.style.display = "block";
                unlockedView.style.display = "none";
                img.style.maxHeight = "250px";
                
                priceDiv.innerHTML = `Pri: <span style="color: #ff3b30;">${cost} Kredi 💰</span>`;
                actionBtn.innerText = `🔓 Peye pou Deboke (${cost} cr)`;
                actionBtn.onclick = async () => {
                    modal.style.display = "none"; 
                    try {
                        const userSnap = await get(ref(db, `RJFORDROID/USERS/${currentUserKey}`));
                        const userCredits = userSnap.val().credits || 0;

                        if (userCredits < cost) {
                            showPopup(`Kredi Enfisiyan : Ou bezwen ${cost} kredi pou deboke dokiman sa a. Ou gen sèlman ${userCredits} kredi.`); 
                            return;
                        }

                        showPopup(`Èske ou vle deboke "${doc.Titre}" pou ${cost} kredi?`, true, async () => {
                            const updates = {};
                            updates[`RJFORDROID/USERS/${currentUserKey}/credits`] = userCredits - cost;
                            updates[`RJFORDROID/USERS/${currentUserKey}/unlockedPdfs/${pdfId}`] = true;
                            await update(ref(db), updates);
                            
                            showPopup("Dokiman deboke ak siksè! Klike sou li ankò pou wè opsyon yo.");
                            
                            currentUser.credits = userCredits - cost;
                            if(!currentUser.unlockedPdfs) currentUser.unlockedPdfs = {};
                            currentUser.unlockedPdfs[pdfId] = true;
                            localStorage.setItem("rjfordroid_session", JSON.stringify({ key: currentUserKey, data: currentUser }));
                            refreshMyInfoUI();
                            loadPDFs(); 
                        });
                    } catch (e) { showPopup("Erè: Gen yon pwoblèm ki rive. Tanpri eseye ankò."); }
                };
            }

            modal.style.display = "block";
        };

        // Fonctionnalité Liker/Disliker un Ebook (+1 Crédit sur le premier vote)
        window.votePdf = async function(pdfId, type) {
            if(!currentUserKey) return;
            const pdfRef = ref(db, `RJFORDROID/pdf/${pdfId}`);
            try {
                const snap = await get(pdfRef);
                if (!snap.exists()) return;
                let data = snap.val();
                let voters = data.voters || {};
                let currentVote = voters[currentUserKey];
                
                if (currentVote === type) return; 
                
                let likes = data.likes || 0;
                let dislikes = data.dislikes || 0;
                
                if (type === 'like') {
                    likes++;
                    if (currentVote === 'dislike') dislikes--;
                } else if (type === 'dislike') {
                    dislikes++;
                    if (currentVote === 'like') likes--;
                }
                
                voters[currentUserKey] = type;
                
                const updates = {};
                updates[`RJFORDROID/pdf/${pdfId}/likes`] = likes;
                updates[`RJFORDROID/pdf/${pdfId}/dislikes`] = dislikes;
                updates[`RJFORDROID/pdf/${pdfId}/voters`] = voters;
                
                await update(ref(db), updates);
                
                if (!currentVote) {
                    addCredits(1);
                    showPopup("+1 Crédit pour votre vote !");
                }
            } catch(e) { console.error(e); }
        };

        // Commenter un PDF (+10 Crédit 1er comment, +2 suivants)
        window.sendPdfComment = async function(pdfId) {
            const input = document.getElementById('pdf-comment-input');
            const text = input.value.trim();
            if(!text || !currentUserKey) return;
            
            input.value = "";
            
            try {
                const commenterRef = ref(db, `RJFORDROID/pdf/${pdfId}/commenters/${currentUserKey}`);
                const snap = await get(commenterRef);
                const isFirst = !snap.exists();
                
                if (isFirst) {
                    await set(commenterRef, true);
                    addCredits(10);
                    showPopup("+10 Crédits pour votre premier commentaire !");
                } else {
                    addCredits(2);
                    let toast = document.createElement("div");
                    toast.innerText = "💬 +2 Crédits !";
                    toast.style.cssText = "position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#00a884; color:white; padding:10px 20px; border-radius:20px; font-weight:bold; z-index:10000; box-shadow:0 4px 10px rgba(0,0,0,0.3);";
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2000);
                }
                
                await push(ref(db, `RJFORDROID/pdf/${pdfId}/comments`), {
                    user: currentUser.username,
                    text: text,
                    timestamp: serverTimestamp()
                });
                
            } catch(e) { console.error(e); }
        };

        // Lire le PDF sur l'App (+10 Crédit toutes les 15s) MIZAJOU POU LINK DRIVE
        window.pdfTimer = null;
        window.readPdfInApp = function(url, title) {
            // Fermer le modal précédent
            document.getElementById('ebookModal').style.display = 'none';
            if(window.pdfRealtimeUnsubscribe) window.pdfRealtimeUnsubscribe();
            
            // Corriger l'URL Google Drive pour forcer l'aperçu/afichaj (Drive link fix)
            let embedUrl = url;
            if (url && (url.includes("drive.google.com") || url.includes("docs.google.com"))) {
                const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    embedUrl = `https://drive.google.com/file/d/${idMatch[1]}/preview`;
                } else {
                    const queryMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                    if (queryMatch && queryMatch[1]) {
                        embedUrl = `https://drive.google.com/file/d/${queryMatch[1]}/preview`;
                    }
                }
            }

            document.getElementById('pdf-reader-title').innerText = title;
            document.getElementById('pdf-iframe').src = embedUrl;
            document.getElementById('pdf-reader-overlay').style.display = 'block';
            
            // Démarrer la Minuterie (15 secondes = 10 crédits)
            window.pdfTimer = setInterval(() => {
                addCredits(10);
                let toast = document.createElement("div");
                toast.innerText = "⏱️ Lecture : +10 Crédits gagnés !";
                toast.style.cssText = "position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#00a884; color:white; padding:10px 20px; border-radius:20px; font-weight:bold; z-index:10000; box-shadow:0 4px 10px rgba(0,0,0,0.3);";
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }, 15000);
        };
        
        window.closePdfReader = function() {
            document.getElementById('pdf-reader-overlay').style.display = 'none';
            document.getElementById('pdf-iframe').src = "";
            if (window.pdfTimer) {
                clearInterval(window.pdfTimer);
                window.pdfTimer = null;
            }
        };

        function listenToAllChats() {
            onValue(ref(db, 'RJFORDROID/CHAT_USERS'), (snapshot) => {
                allChatsData = snapshot.exists() ? snapshot.val() : {}; const now = Date.now();
                for(let chatId in allChatsData) {
                    const messages = allChatsData[chatId]; let validMsgs = [];
                    for(let messageKey in messages) {
                        const msg = messages[messageKey];
                        if(msg.timestamp && (now - msg.timestamp > 86400000)) remove(ref(db, `RJFORDROID/CHAT_USERS/${chatId}/${messageKey}`)); else validMsgs.push(msg);
                    }
                    const count = validMsgs.length;
                    if (previousMessageCounts[chatId] !== undefined && count > previousMessageCounts[chatId]) {
                        const lastMsg = validMsgs[validMsgs.length - 1];
                        if (isAppLoaded && lastMsg && lastMsg.sender !== currentUser.username) { notifSound.currentTime = 0; notifSound.play().catch(()=>{}); voyeNotifikasyonAndroid("Mesaj soti nan " + lastMsg.sender, lastMsg.text ? lastMsg.text : "📸 Imaj resevwa"); showBrowserNotification("Nouveau message de " + lastMsg.sender, lastMsg.text ? lastMsg.text : "📸 Image reçue"); }
                    }
                    previousMessageCounts[chatId] = count;
                }
                updateBadges(); 
            });
        }

        function loadChat(chatId) {
            onValue(ref(db, `RJFORDROID/CHAT_USERS/${chatId}`), (snapshot) => {
                if (currentChatId !== chatId) return; messagesDiv.innerHTML = "";
                if (snapshot.exists()) { const data = snapshot.val(); for (let key in data) displayMessage(data[key], key); }
            });
        }

        function displayMessage(msg, key) {
            const div = document.createElement("div"), isMe = msg.sender === currentUser.username; div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `${isMe ? `<div class="delete-btn" onclick="deleteMessage('${key}')">🗑️</div>` : ''}<div class="msg-sender">${msg.sender}</div>${msg.imageUrl ? `<img src="${msg.imageUrl}" class="msg-img" onclick="window.open('${msg.fullUrl || msg.imageUrl}', '_blank')" />` : ''}${msg.text ? `<div class="msg-text">${msg.text}</div>` : ''}`;
            messagesDiv.appendChild(div); if(currentChatId !== "ACTUALITE" && currentChatId !== "LANG" && currentChatId !== "SERIES" && currentChatId !== "PDF_DOCS") setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 100);
        }

        function sendMessage() { const text = messageInput.value.trim(); if (text === "") return; push(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}`), { sender: currentUser.username, text: text, timestamp: serverTimestamp() }); messageInput.value = ""; emojiPicker.style.display = 'none'; }
        sendBtn.addEventListener("click", sendMessage); messageInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
        window.deleteMessage = (key) => showPopup("Effacer ce message ?", true, () => remove(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}/${key}`)));

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0]; if (!file) return; loader.style.display = "flex"; const reader = new FileReader();
            reader.onload = () => {
                const formData = new FormData(); formData.append("file", reader.result.split(",")[1]); formData.append("name", file.name); formData.append("type", file.type);
                fetch("https://script.google.com/macros/s/AKfycbxHjVBNTOlj6xBUp_fl-aVbPSFZRiMQB77_YIvFeB79uq2Hx9P_r7HADZTYj9WElsXkug/exec", { method: "POST", body: formData })
                .then(r => r.json()).then(res => { loader.style.display = "none"; fileInput.value = ""; if (!res.success) return showPopup("Erreur upload."); const id = res.url.match(/\/d\/([^\/]+)/)?.[1]; if(id) push(ref(db, `RJFORDROID/CHAT_USERS/${currentChatId}`), { sender: currentUser.username, text: "", imageUrl: `https://drive.google.com/thumbnail?id=${id}&sz=w600`, fullUrl: res.url, timestamp: serverTimestamp() }); }).catch(() => { loader.style.display = "none"; showPopup("Erreur serveur."); });
            }; reader.readAsDataURL(file);
        });

        const emojis = ['😀','😂','🤣','😊','😍','🥰','😎','🤓','😭','😤','😡','🤬','🤯','🥶','🥵','🥳','🤔','🙄','🤫','🤥','😴','🤢','🤮','🤠','😈','👻','💩','👽','🤖','🎃','🫶','👍','👎','👊','✌️','🤞','🤟','🤘','👌','🤌','🤏','👇','👆','👉','👈','🙏','💪','🧠','👀','👅','💋','🔥','✨','🎉','💯','❤️','💔','🎈','🎁','👑'];
        emojis.forEach(emoji => { let span = document.createElement('span'); span.className = 'emoji-item'; span.innerText = emoji; span.onclick = () => { messageInput.value += emoji; emojiPicker.style.display = 'none'; messageInput.focus(); }; emojiPicker.appendChild(span); });
        emojiBtn.addEventListener("click", () => { emojiPicker.style.display = emojiPicker.style.display === "grid" ? "none" : "grid"; });
    </script>
