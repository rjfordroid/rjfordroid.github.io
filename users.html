<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RJ4Droid - Login / Signup</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#111,#1c1c1c);
}

.container{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-radius:15px;
  padding:35px;
  box-shadow:0 10px 40px rgba(0,0,0,0.4);
  color:white;
}

.container h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
  letter-spacing:1px;
}

.tabs{
  display:flex;
  margin-bottom:25px;
  border-radius:8px;
  overflow:hidden;
  background:#222;
}

.tabs div{
  flex:1;
  text-align:center;
  padding:12px;
  cursor:pointer;
  transition:0.3s;
  font-weight:500;
  color:#aaa;
}

.tabs div.active{
  background:#ff6600;
  color:white;
}

form{
  display:none;
  flex-direction:column;
}

form.active{
  display:flex;
}

input{
  background:#1f1f1f;
  border:1px solid #333;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  color:white;
  font-size:14px;
  transition:0.3s;
}

input:focus{
  border-color:#ff6600;
  outline:none;
}

button{
  padding:12px;
  border:none;
  border-radius:8px;
  background:#ff6600;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#ff8533;
}

.message{
  display:none;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  font-size:13px;
}

.message.success{
  background:#1f3d1f;
  color:#7CFC00;
}

.message.error{
  background:#3d1f1f;
  color:#ff4d4d;
}

#logoutBtn{
  margin-top:20px;
  background:#444;
}

#logoutBtn:hover{
  background:#666;
}

/* Responsive mobile */
@media(max-width:480px){
  .container{
    margin:20px;
    padding:25px;
  }
}
/* ===== Left Branding ===== */
.left{
  flex:1;
  padding:8px;
  display:block;
  flex-direction:column;
  justify-content:center;
}

.left h1{
  text-align: center;
  font-size:40px;
  margin-bottom:20px;
  color:#ff6600;
}

.left p{
  font-size:14px;
  line-height:1.6;
  color:#ccc;
  max-width:500px;
  text-align: center;
  margin-bottom: 10px;
}
hr{
  border: 3px solid;
  margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="left">
    <h1>RJ4Droid</h1>
    <p>
      Plateforme digitale moderne pour gérer vos services,
      automatiser vos processus et développer votre présence en ligne.
      Sécurisé. Rapide. Professionnel.
    </p>
  </div><hr>


  <div class="tabs">
    <div id="loginTab" class="active">Login</div>
    <div id="signupTab">Signup</div>
  </div>

  <!-- LOGIN -->
  <form id="loginForm" class="active">
    <input type="text" id="loginUsername" placeholder="Username ou Email" required>
    <input type="password" id="loginPassword" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
    <div id="loginMessage" class="message"></div>
  </form>

  <!-- SIGNUP -->
  <form id="signupForm">
    <input type="text" id="fullName" placeholder="Nom complet" required>
    <input type="text" id="username" placeholder="Nom d'utilisateur" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="phone" placeholder="Téléphone">
    <input type="password" id="password" placeholder="Mot de passe" required>
    <input type="password" id="confirmPassword" placeholder="Confirmer mot de passe" required>
    <button type="submit">Créer un compte</button>
    <div id="signupMessage" class="message"></div>
  </form>

  <button id="logoutBtn" style="display:none;margin-top:20px;">Se déconnecter</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>


<script src="js/firebase.js"></script>
<script src="js/user.js"></script>


</body>
</html>
