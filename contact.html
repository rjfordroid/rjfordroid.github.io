<style>
a:hover { text-decoration: underline; }
img, video, iframe {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 10px 0;
}
form{
  padding: 10px;
  width: 80%;
  margin: auto;
}

/* ==== FORMULAIRE ==== */
form input, form textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border: 1px solid #ccc;
  border-radius: 5px;
}
form input[type="submit"] {
  background: #ff6600;
  color: #fff;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}
form input[type="submit"]:hover {
  background: #e55a00;
}

/* ==== LISTE D'ARTICLES ==== */
.list-item {
  background: #f8f8f8;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  transition: 0.3s;
}
.list-item:hover {
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}
.category-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 15px;
  font-size: 0.8em;
  color: #fff;
  margin-bottom: 10px;
}

/* ==== BOUTONS ==== */
button {
  background-color: #ff6600;
  color: #fff;
  border: none;
  padding: 7px 15px;
  margin-right: 5px;
  border-radius: 5px;
  cursor: pointer;
  transition: 0.3s;
}
button:hover { background-color: #e55a00; }

/* ==== POPUP ==== */
.popup {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #4CAF50;
  color: white;
  padding: 15px;
  border-radius: 5px;
  z-index: 1000;
}

/* ==== DÉTAIL ARTICLE ==== */
#detailList { display: none; }
.comment-bubble {
  padding: 8px 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: #e0e0e0;
}
.comment-bubble.self { background: #28a745; color: #fff; text-align: right; }
.comment-bubble.other { background: #ccc; text-align: left; }

/* ==== GRID RESPONSIVE ==== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

/* ==== FOOTER ==== */
footer {
  text-align: center;
  margin-top: 50px;
  font-size: 0.9em;
  color: #555;
}
</style>

     <main class="main-content">
<h1>Contactez-nous</h1>
<p>
Vous avez une question, une suggestion ou vous souhaitez collaborer avec <strong>RJForDroid</strong> ? N'hésitez pas à nous contacter !
</p>
<p>
Email : <a href="mailto:rjfordroid@gmail.com">rjfordroid@gmail.com</a><br>
Formulaire : Vous pouvez remplir le formulaire ci-dessous pour nous envoyer un message directement depuis le site.
</p>
<form action="mailto:rjfordroid@gmail.com" method="post" enctype="text/plain">
  <label for="name">Nom :</label><br>
  <input type="text" id="name" name="name" required><br><br>
  
  <label for="email">Email :</label><br>
  <input type="email" id="email" name="email" required><br><br>
  
  <label for="message">Message :</label><br>
  <textarea id="message" name="message" rows="5" required></textarea><br><br>
  
  <input type="submit" value="Envoyer">
</form>

</main>
