/* ============================================================
   5. CATALOGUE & COURSE CARDS
   ============================================================ */
@media all {
    /* Grid katalòg la */
    .course-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 10px;
        padding: 2px;
    }

    /* Kat kou yo */
    .course-card {
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        border: 1px solid #f1f5f9;
        display: flex;
        flex-direction: column;
        transition: all 0.3s ease;
        position: relative;
    }

    .course-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border-color: #2563eb;
    }

    /* Tit ak Deskripsyon */
    .course-card h4 {
        font-size: 1.4rem;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .course-card p {
        font-size: 1.1rem;
        text-align: justify;
        color: black;
        margin-bottom: 15px;
        line-height: 1.4;
    }
    .small{
      display: flex;
      flex-wrap: nowrap;
      gap: 5px;
    }
    .course-card small {
        color: white;
        margin-bottom: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        width: 100%;
    }

    /* Badge yo */
    .badge {
        font-size: 0.7rem;
        padding: 4px 10px;
        border-radius: 30px;
        background: #eff6ff;
        color: #2563eb;
        font-weight: 600;
    }

    /* Social Stats (Like/Share) */
    .social-stats {
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
        padding-top: 10px;
        border-top: 1px solid #f8fafc;
    }

    .social-stats span {
        font-size: 0.85rem;
        font-weight: 600;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    .social-stats .liked {
        color: #ef4444;
    }

    /* Bouton Pro */
    .course-card button {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.2s;
        border: none;
    }

    .btn-enroll {
        background: #2563eb;
        color: white;
    }

    .btn-share {
        background: #f1f5f9;
        color: #475569;
        margin-bottom: 8px;
    }

    .btn-locked {
        background: #f8fafc;
        color: #94a3b8;
        cursor: not-allowed;
    }
}


/* ============================================================
   6. SOCIAL FEATURES (LIKE & SHARE)
   ============================================================ */

        align-items: center;

        padding: 5px 0;
        border-bottom: 1px solid #f1f5f9;

    }

    .social-stats span {

        align-items: center;
        gap: 5px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .social-stats span:active { transform: scale(1.2); }

    .share-btn {

}

<script>
/* ================================
   OUTILS UTILITAIRES
================================ */
function safeParseUser(str) {
  if (!str) return null;
  try {
    return JSON.parse(str);
  } catch {
    return { uid: str, credits: 0, username: "Anonyme", mes_cours: {} };
  }
}

/* ================================
   CHARGER LE CATALOGUE
================================ */
window.chargerCatalogue = async function () {
  const container = document.getElementById("catalogue-cours");
  const loading = document.getElementById("catalogue-loading");
  if (!container) return;

  if (loading) loading.style.display = "flex";

  const uid = localStorage.getItem("connectedUID");
  let currentUser = {};
  let userCredits = 0;
  let username = "Anonyme";

  if (uid) {
    const snapUser = await database.ref("RJFORDROID/USERS/" + uid).once("value");
    currentUser = snapUser.val() || {};
    userCredits = Number(currentUser.credits ?? 0);
    username = currentUser.username || "Anonyme";
  }

  const snapCours = await database.ref("RJFORDROID/COURE").once("value");

  container.innerHTML = "";
  if (loading) loading.style.display = "none";

  if (!snapCours.exists()) {
    container.innerHTML = "<p>Aucun cours disponible.</p>";
    return;
  }

  snapCours.forEach(child => {
    const courseId = child.key;
    const c = child.val();

    const likes = c.likes || {};
    const shares = c.shares || {};
    const numLikes = Object.keys(likes).length;
    const numShares = Object.keys(shares).length;
    const hasLiked = !!likes[username];

    const creditsCours = Number(c.credits ?? 0);
    const alreadyEnrolled = !!currentUser?.mes_cours?.[courseId];
    const bloque = creditsCours > 0 && userCredits < creditsCours && !alreadyEnrolled;

    const lessons = c.lessons || {};
    const totalLessons = Object.keys(lessons).length;
    const doneLessons = Object.keys(
      currentUser?.mes_cours?.[courseId]?.lessons || {}
    ).length;

    const progression = totalLessons
      ? Math.round((doneLessons / totalLessons) * 100)
      : 0;

    const card = document.createElement("div");
    card.className = "course-card";

    card.innerHTML = `
      <h4>${c.NomCours || "Sans titre"}</h4>
      <p>${c.DesCours || ""}</p>

      <div class="social-stats">
        <span onclick="toggleLike('${courseId}','${username}',${hasLiked})">
          <i class="${hasLiked ? 'fas' : 'far'} fa-heart"></i> ${numLikes}
        </span>
        <span>
          <i class="fas fa-share"></i> ${numShares}
        </span>
      </div>

        <div style="display:flex; flex-wrap:nowrap; gap:10px;">
                <small>📘 ${totalLessons} leçons</small>
      <small>📊 ${progression}%</small>
      <small>${creditsCours}Credits</small>
        </div>

      <div style="display:flex; flex-wrap:nowrap; gap:10px;">
        <button class="share-btn"
        onclick="patajeKou('${courseId}','${c.NomCours}','${username}')">
        Partager
      </button>

      ${
        alreadyEnrolled
          ? `<button disabled>Déjà inscrit</button>`
          : `<button ${bloque ? "disabled" : ""}
              onclick="inscrireCours('${courseId}',${creditsCours})">
              ${bloque ? "Crédits insuffisants" : "S’inscrire"}
            </button>`
      }
      </div>
    `;

    container.appendChild(card);
  });
};

/* ================================
   LIKE
================================ */
window.toggleLike = function (courseId, username, hasLiked) {
  if (!username) return;
  const ref = database.ref(`RJFORDROID/COURE/${courseId}/likes/${username}`);
  hasLiked ? ref.remove() : ref.set(Date.now());
};

/* ================================
   PARTAGE
================================ */
window.patajeKou = function (id, titre, username) {
  const url = location.href + "?id=" + id;
  const msg = `📚 ${titre}\n${url}`;

  database.ref(`RJFORDROID/COURE/${id}/shares`).push({
    user: username,
    date: Date.now()
  });

  if (navigator.share) {
    navigator.share({ title: titre, text: msg, url });
  } else {
    navigator.clipboard.writeText(msg);
    alert("Lien copié");
  }
};

/* ================================
   INSCRIPTION
================================ */
window.inscrireCours = async function (courseId, creditsCours) {
  const uid = localStorage.getItem("connectedUID");
  if (!uid) {
    animatedPopup("Veuillez vous connecter");
    return;
  }

  const userRef = database.ref("RJFORDROID/USERS/" + uid);
  const snap = await userRef.once("value");
  const user = snap.val();

  if (!user) return;

  const credits = Number(user.credits ?? 0);

  // 🔥 Evite double inscription
  if (user?.mes_cours?.[courseId]) {
    animatedPopup("Vous êtes déjà inscrit");
    return;
  }

  // 🔥 Vérifie crédits
  if (creditsCours > 0 && credits < creditsCours) {
    animatedPopup("Crédits insuffisants");
    return;
  }

  // 🔥 Transaction sécurisée
  await userRef.transaction(currentData => {
    if (!currentData) return currentData;

    const currentCredits = Number(currentData.credits ?? 0);

    if (creditsCours > 0 && currentCredits < creditsCours) {
      return; // Stop si crédits changés entre temps
    }

    if (!currentData.mes_cours) {
      currentData.mes_cours = {};
    }

    currentData.mes_cours[courseId] = {
      progression: 0,
      lessons: {},
      dateInscription: Date.now()
    };

    if (creditsCours > 0) {
      currentData.credits = currentCredits - creditsCours;
    }

    return currentData;
  });

  animatedPopup("Inscription réussie");
  chargerCatalogue();
  loadUserInSidebar();
};
/* ================================
   INIT
================================ */
document.addEventListener("DOMContentLoaded", chargerCatalogue);
</script>
